y="Arial,sans-serif" font-size="14" fill="var(--body,#454c52)">G03 · Chuyện nhỏ của PET</text><line x1="600.0" y1="651.0" x2="600" y2="772" stroke="var(--muted,#657078)" stroke-width="1.8"/><text x="450" y="832" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="var(--ink,#252b32)">Avoidance · 1 → 1</text><text x="450" y="859" font-family="Arial,sans-serif" font-size="14" fill="var(--body,#454c52)">F15 · Vắng không trừ</text><text x="450" y="881" font-family="Arial,sans-serif" font-size="14" fill="var(--body,#454c52)">F23 · Quay lại không nợ</text><line x1="450.1" y1="599.9" x2="286" y2="677" stroke="var(--muted,#657078)" stroke-width="1.8"/><text x="25" y="720" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="var(--ink,#252b32)">Scarcity · 2 → 2</text><text x="25" y="747" font-family="Arial,sans-serif" font-size="14" fill="var(--body,#454c52)">F05 · Lịch hẹn, không hạn quà</text><text x="25" y="769" font-family="Arial,sans-serif" font-size="14" fill="var(--body,#454c52)">F17 · Bỏ lỡ vẫn xem hồi tưởng</text><line x1="344.0" y1="450.0" x2="273" y2="450" stroke="var(--muted,#657078)" stroke-width="1.8"/><text x="24" y="424" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="var(--ink,#252b32)">Ownership · 6 → 7</text><text x="24" y="451" font-family="Arial,sans-serif" font-size="14" fill="var(--body,#454c52)">F09 · Danh tính PET ổn định</text><text x="24" y="473" font-family="Arial,sans-serif" font-size="14" fill="var(--body,#454c52)">F15 / F17 · Lịch sử không mất</text><line x1="426.8" y1="276.8" x2="285" y2="227" stroke="var(--muted,#657078)" stroke-width="1.8"/><text x="24" y="150" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="var(--ink,#252b32)">Accomplishment · 5 → 6</text><text x="24" y="177" font-family="Arial,sans-serif" font-size="14" fill="var(--body,#454c52)">F11–13 · Việc nhỏ tự chọn</text><text x="24" y="199" font-family="Arial,sans-serif" font-size="14" fill="var(--body,#4