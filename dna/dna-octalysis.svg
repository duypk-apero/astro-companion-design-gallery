<svg id="oct-chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="oct-title oct-desc">
<title id="oct-title">Octalysis: thiết kế v1 và hướng phát triển</title>
<desc id="oct-desc">Vùng xanh là thiết kế v1; viền đất nung nét đứt là hướng phát triển sau kiểm chứng. Meaning 4 đến 5; Empowerment 3 đến 5; Social Influence 3 đến 5; Unpredictability 5 đến 6; Avoidance 1 đến 1; Scarcity 2 đến 2; Ownership 6 đến 7; Accomplishment 5 đến 6. Điểm tương lai chỉ minh họa cường độ dự kiến khi cơ chế được thiết kế sâu hơn, không phải kết quả đã đạt.</desc>
<defs><linearGradient id="oct-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168b95"/><stop offset="1" stop-color="#133d8c"/></linearGradient></defs>
